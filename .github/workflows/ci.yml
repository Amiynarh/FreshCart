name: CI - Pull Request Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'checkout-api/**'
      - '.github/workflows/ci.yml'

jobs:
  verify-code:
    name: Lint & Typecheck Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./checkout-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./checkout-api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Build & Compilation Checks
        run: |
          npm run lint --if-present
          npm run build --if-present
