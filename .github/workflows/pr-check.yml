name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # This tells the runner to execute all 'run' commands inside the checkout-api folder
    defaults:
      run:
        working-directory: ./checkout-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './checkout-api/package-lock.json' # Specifies where the lock file is for caching

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        # If there's no build step, you can change this to 'npm run test' or 'npm run typecheck' based on your package.json
        run: npm run build